<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Performance Rewards Dashboard</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #d8dde3;
    --text: #1b1f24;
    --text-muted: #5b6472;
    --accent: #6264a7;
    --accent-contrast: #ffffff;
    --stripe: #f0f2f5;
    --total-bg: #eef1fa;
    --error: #b42318;
    --error-bg: #fdecea;
    --error-border: #f3b7b0;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1d2025;
      --border: #33373f;
      --text: #e6e8eb;
      --text-muted: #9aa2ad;
      --accent: #8b8ee0;
      --accent-contrast: #14161a;
      --stripe: #23262c;
      --total-bg: #2a2d55;
      --error: #ff6b61;
      --error-bg: #3a1f1e;
      --error-border: #5c2f2c;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px 48px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .container {
    max-width: 1000px;
    margin: 0 auto;
  }

  header.page-header {
    margin-bottom: 24px;
  }

  header.page-header h1 {
    margin: 0 0 8px;
    font-size: 1.6rem;
  }

  .status-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    align-items: center;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .error-note {
    color: var(--error);
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    border-radius: 6px;
    padding: 2px 10px;
  }

  section.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px 22px;
    margin-bottom: 24px;
  }

  section.card h2 {
    margin: 0 0 4px;
    font-size: 1.15rem;
    color: var(--accent);
  }

  .section-label {
    margin: 0 0 14px;
    font-size: 0.9rem;
    color: var(--text-muted);
  }

  .table-wrapper {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  th, td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  th {
    background: var(--accent);
    color: var(--accent-contrast);
    text-align: left;
    position: sticky;
    top: 0;
  }

  tbody tr:nth-child(even) {
    background: var(--stripe);
  }

  tr.total-row {
    font-weight: 700;
    background: var(--total-bg) !important;
    border-top: 2px solid var(--accent);
  }

  .no-data {
    color: var(--text-muted);
    font-style: italic;
    padding: 12px 0;
    grid-column: 1 / -1;
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }

  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .kpi-label {
    margin: 0 0 6px;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .kpi-value {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text);
  }
</style>
</head>
<body>
  <div class="container">
    <header class="page-header">
      <h1>Performance Rewards Dashboard</h1>
      <div class="status-bar">
        <span id="dataDate">Data as of: –</span>
        <span id="lastUpdated">Last updated: –</span>
        <span id="errorNote" class="error-note" hidden></span>
      </div>
    </header>

    <section class="kpi-section" aria-label="KPI Summary">
      <div class="kpi-grid" id="kpiGrid">
        <p class="no-data">Loading data…</p>
      </div>
    </section>

    <section class="card">
      <h2>Previous Day Performance Breakdown</h2>
      <p class="section-label" id="dailyDateLabel"></p>
      <div id="dailySection">
        <p class="no-data">Loading data…</p>
      </div>
    </section>

    <section class="card">
      <h2>Weekly Performance Report</h2>
      <p class="section-label" id="weeklyWeekLabel"></p>
      <div id="weeklySection">
        <p class="no-data">Loading data…</p>
      </div>
    </section>
  </div>

  <script>
    (function () {
      var DATA_URL = './last_known_yesterday.json';
      var REFRESH_INTERVAL_MS = 30000;
      var lastDataStr = null;

      function clearChildren(el) {
        while (el.firstChild) el.removeChild(el.firstChild);
      }

      function makeCell(tag, text, align) {
        var el = document.createElement(tag);
        el.textContent = text;
        if (align) el.style.textAlign = align;
        return el;
      }

      function makeNoDataMessage(text) {
        var p = document.createElement('p');
        p.className = 'no-data';
        p.textContent = text;
        return p;
      }

      function formatAmount(n) {
        return '₹' + n;
      }

      function computeWeeklyRows(json) {
        var totals = (json && json.week && json.week.totals) || {};
        var names = Object.keys(totals);
        var rows = names.map(function (n) {
          var t = totals[n] || {};
          return {
            name: n,
            points: Number(t.points) || 0,
            amount: Number(t.amount) || 0
          };
        });
        rows.sort(function (a, b) {
          if (b.amount !== a.amount) return b.amount - a.amount;
          return a.name.localeCompare(b.name);
        });
        return rows;
      }

      function makeKpiCard(label, value) {
        var card = document.createElement('div');
        card.className = 'kpi-card';
        var labelEl = document.createElement('p');
        labelEl.className = 'kpi-label';
        labelEl.textContent = label;
        var valueEl = document.createElement('p');
        valueEl.className = 'kpi-value';
        valueEl.textContent = value;
        card.appendChild(labelEl);
        card.appendChild(valueEl);
        return card;
      }

      function renderKpiCards(json) {
        var container = document.getElementById('kpiGrid');
        clearChildren(container);

        var employees = (json && json.employees) || {};
        var weeklyRows = computeWeeklyRows(json);

        var nameSet = {};
        Object.keys(employees).forEach(function (n) { nameSet[n] = true; });
        weeklyRows.forEach(function (r) { nameSet[r.name] = true; });
        var totalEmployees = Object.keys(nameSet).length;

        var totalPoints = weeklyRows.reduce(function (sum, r) { return sum + r.points; }, 0);
        var totalAmount = weeklyRows.reduce(function (sum, r) { return sum + r.amount; }, 0);
        var zeroPointCount = weeklyRows.filter(function (r) { return r.points === 0; }).length;

        container.appendChild(makeKpiCard('Total Employees', totalEmployees ? String(totalEmployees) : '–'));
        container.appendChild(makeKpiCard('Total Weekly Points', weeklyRows.length ? String(totalPoints) : '–'));
        container.appendChild(makeKpiCard('Total Weekly Amount', weeklyRows.length ? formatAmount(totalAmount) : '–'));
        container.appendChild(makeKpiCard('Top Performer (This Week)', weeklyRows.length ? weeklyRows[0].name : '–'));
        container.appendChild(makeKpiCard('Employees with Zero Points (This Week)', weeklyRows.length ? String(zeroPointCount) : '–'));
      }

      function renderDailyTable(json) {
        var container = document.getElementById('dailySection');
        clearChildren(container);

        var employees = (json && json.employees) || {};
        var names = Object.keys(employees);

        if (names.length === 0) {
          container.appendChild(makeNoDataMessage('No previous-day performance data available.'));
          return;
        }

        var categories = [];
        var seen = {};
        names.forEach(function (n) {
          var emp = employees[n] || {};
          Object.keys(emp).forEach(function (k) {
            if (!seen[k]) {
              seen[k] = true;
              categories.push(k);
            }
          });
        });

        var sortedNames = names.slice().sort(function (a, b) {
          return a.localeCompare(b);
        });

        var wrapper = document.createElement('div');
        wrapper.className = 'table-wrapper';
        var table = document.createElement('table');

        var thead = document.createElement('thead');
        var headRow = document.createElement('tr');
        headRow.appendChild(makeCell('th', 'Name'));
        categories.forEach(function (c) {
          headRow.appendChild(makeCell('th', c, 'center'));
        });
        thead.appendChild(headRow);
        table.appendChild(thead);

        var tbody = document.createElement('tbody');
        sortedNames.forEach(function (name) {
          var row = document.createElement('tr');
          row.appendChild(makeCell('td', name));
          categories.forEach(function (c) {
            var emp = employees[name] || {};
            var val = emp[c];
            row.appendChild(makeCell('td', val === undefined ? '–' : String(val), 'center'));
          });
          tbody.appendChild(row);
        });
        table.appendChild(tbody);

        wrapper.appendChild(table);
        container.appendChild(wrapper);
      }

      function renderWeeklyTable(json) {
        var container = document.getElementById('weeklySection');
        clearChildren(container);

        var totals = (json && json.week && json.week.totals) || {};
        var names = Object.keys(totals);

        if (names.length === 0) {
          container.appendChild(makeNoDataMessage('No weekly performance data available.'));
          return;
        }

        var rows = names.map(function (n) {
          var t = totals[n] || {};
          return {
            name: n,
            points: Number(t.points) || 0,
            amount: Number(t.amount) || 0
          };
        });

        rows.sort(function (a, b) {
          if (b.amount !== a.amount) return b.amount - a.amount;
          return a.name.localeCompare(b.name);
        });

        var wrapper = document.createElement('div');
        wrapper.className = 'table-wrapper';
        var table = document.createElement('table');

        var thead = document.createElement('thead');
        var headRow = document.createElement('tr');
        headRow.appendChild(makeCell('th', 'Name'));
        headRow.appendChild(makeCell('th', 'Points', 'center'));
        headRow.appendChild(makeCell('th', 'Amount', 'right'));
        thead.appendChild(headRow);
        table.appendChild(thead);

        var tbody = document.createElement('tbody');
        var totalPoints = 0;
        var totalAmount = 0;

        rows.forEach(function (r) {
          totalPoints += r.points;
          totalAmount += r.amount;
          var row = document.createElement('tr');
          row.appendChild(makeCell('td', r.name));
          row.appendChild(makeCell('td', String(r.points), 'center'));
          row.appendChild(makeCell('td', formatAmount(r.amount), 'right'));
          tbody.appendChild(row);
        });

        var totalRow = document.createElement('tr');
        totalRow.className = 'total-row';
        totalRow.appendChild(makeCell('td', 'TOTAL'));
        totalRow.appendChild(makeCell('td', String(totalPoints), 'center'));
        totalRow.appendChild(makeCell('td', formatAmount(totalAmount), 'right'));
        tbody.appendChild(totalRow);

        table.appendChild(tbody);
        wrapper.appendChild(table);
        container.appendChild(wrapper);
      }

      function updateLabels(json) {
        var dailyLabel = document.getElementById('dailyDateLabel');
        dailyLabel.textContent = (json && json.date) ? ('Date: ' + json.date) : '';

        var weeklyLabel = document.getElementById('weeklyWeekLabel');
        var weekStart = json && json.week && json.week.week_start;
        weeklyLabel.textContent = weekStart ? ('Week starting: ' + weekStart) : '';
      }

      function updateLastUpdated(json) {
        document.getElementById('dataDate').textContent =
          'Data as of: ' + ((json && json.date) ? json.date : 'unknown');
        document.getElementById('lastUpdated').textContent =
          'Last updated: ' + new Date().toLocaleString();
      }

      function showError() {
        var el = document.getElementById('errorNote');
        el.hidden = false;
        el.textContent = "Couldn't refresh, will retry…";
      }

      function clearError() {
        var el = document.getElementById('errorNote');
        el.hidden = true;
        el.textContent = '';
      }

      function pollOnce() {
        fetch(DATA_URL, { cache: 'no-store' })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function (json) {
            clearError();
            var jsonStr = JSON.stringify(json);
            if (jsonStr !== lastDataStr) {
              lastDataStr = jsonStr;
              renderKpiCards(json);
              renderDailyTable(json);
              renderWeeklyTable(json);
              updateLabels(json);
              updateLastUpdated(json);
            }
          })
          .catch(function () {
            showError();
          });
      }

      pollOnce();
      setInterval(pollOnce, REFRESH_INTERVAL_MS);
    })();
  </script>
</body>
</html>
